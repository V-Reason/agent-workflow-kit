[project]
name = "app"
version = "0.1.0"
description = "通用软件项目骨架（Agent 工作流 v2.0 配套模板）：src 四层架构 + uv + ruff + mypy + pytest"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["AI_Context"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入顺序）
    "N",   # pep8-naming
    "UP",  # pyupgrade（现代化语法）
    "B",   # flake8-bugbear（常见缺陷）
    "A",   # flake8-builtins（遮蔽内置名）
    "C4",  # flake8-comprehensions
    "RET", # flake8-return（返回纪律）
    "SIM", # flake8-simplify
    "RUF", # ruff 专属规则
]

[tool.ruff.lint.per-file-ignores]
# 测试中允许函数式断言辅助与长参数
"tests/*" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
